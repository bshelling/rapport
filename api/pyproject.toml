[project]
name = "rapport-api"
version = "0.1.0"
description = "Rapport HTTP API (FastAPI on AWS Lambda)"
authors = [
    { name = "bshelling", email = "bshelling@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.103",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[dynamodb]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
