name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: "Allow a plan that deletes or replaces resources"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.tf.outputs.site_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Build Lambda package
        run: scripts/build-api-zip.sh

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform apply
        id: tf
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -var "app_version=${GITHUB_SHA}" -out=tfplan
          # Guard: never delete/replace resources unless explicitly allowed. This also
          # protects against transient "resource has been deleted" misreads on refresh.
          terraform show -json tfplan > plan.json
          destroying=$(jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' plan.json)
          if [ -n "$destroying" ] && [ "${{ inputs.allow_destroy }}" != "true" ]; then
            echo "::error::Plan would delete or replace resources:"
            echo "$destroying"
            exit 1
          fi
          terraform apply -input=false tfplan
          echo "site_url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
          echo "site_bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$(terraform output -raw user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(terraform output -raw user_pool_client_id)" >> "$GITHUB_OUTPUT"
          echo "auth_domain=$(terraform output -raw auth_domain)" >> "$GITHUB_OUTPUT"
          # Browser map key (restricted to tile reads from our origins).
          key=$(aws location describe-key --key-name "$(terraform output -raw map_key_name)" --query Key --output text)
          echo "::add-mask::$key"
          echo "map_api_key=$key" >> "$GITHUB_OUTPUT"

      - name: NOLA 311 import and stats
        working-directory: infra/envs/prod
        run: |
          table=$(terraform output -raw table_name)
          state=$(aws dynamodb get-item --table-name "$table" \
            --key '{"PK":{"S":"INGEST#nola311"},"SK":{"S":"STATE"}}' --query Item --output text)
          if [ "$state" = "None" ] || [ -z "$state" ]; then
            echo "No import state yet: running the 24-month backfill"
            aws lambda invoke --function-name "$(terraform output -raw ingest_function_name)" \
              --cli-read-timeout 900 --payload '{"mode":"backfill","months":24}' \
              --cli-binary-format raw-in-base64-out backfill.json
            cat backfill.json
          else
            # Incremental catch-up; also refreshes the home page stats.
            aws lambda invoke --function-name "$(terraform output -raw ingest_function_name)" \
              --cli-read-timeout 900 --payload '{}' \
              --cli-binary-format raw-in-base64-out ingest.json
            cat ingest.json
          fi

      - name: Build web
        working-directory: web
        env:
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ steps.tf.outputs.user_pool_id }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ steps.tf.outputs.user_pool_client_id }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ steps.tf.outputs.auth_domain }}
          NEXT_PUBLIC_MAP_API_KEY: ${{ steps.tf.outputs.map_api_key }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload web
        working-directory: web/out
        run: |
          # Hashed assets are immutable; everything else revalidates.
          aws s3 sync _next "s3://${{ steps.tf.outputs.site_bucket }}/_next" \
            --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync . "s3://${{ steps.tf.outputs.site_bucket }}" \
            --delete --exclude "_next/*" --exclude "*.mjs" --cache-control "public,max-age=0,must-revalidate"
          # ES module workers (MapLibre) must be served with a JavaScript MIME type.
          aws s3 sync . "s3://${{ steps.tf.outputs.site_bucket }}" --exclude "*" --include "*.mjs" \
            --content-type "text/javascript" --cache-control "public,max-age=0,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" --paths "/*" >/dev/null

      - name: Smoke test
        env:
          SITE: ${{ steps.tf.outputs.site_url }}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf "$SITE/api/health" || true)
            if echo "$body" | grep -q "$GITHUB_SHA"; then echo "$body"; break; fi
            sleep 10
          done
          echo "$body" | grep -q "$GITHUB_SHA" || { echo "API not serving $GITHUB_SHA"; exit 1; }
          curl -sf "$SITE/" | grep -q "Report it in a minute" || { echo "home page check failed"; exit 1; }

      - name: Playwright against prod
        working-directory: web
        env:
          BASE_URL: ${{ steps.tf.outputs.site_url }}
          E2E_EMAIL: e2e@example.com
        run: |
          E2E_PASSWORD=$(aws ssm get-parameter --name /rapport/prod/e2e/password \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$E2E_PASSWORD"
          export E2E_PASSWORD
          E2E_NEIGHBOR_REPORT_ID=$(cd .. && uv run -q --with boto3 scripts/seed-e2e.py prod)
          export E2E_NEIGHBOR_REPORT_ID
          bunx playwright install --with-deps chromium
          bunx playwright test --workers=1

      - name: Remove Playwright test data
        if: always() && steps.tf.outcome == 'success'
        run: uv run -q --with boto3 scripts/cleanup-e2e.py prod

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: prod-screenshots
          path: web/screenshots/
          if-no-files-found: ignore

      - name: Summary
        run: echo "Deployed ${GITHUB_SHA::7} to ${{ steps.tf.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
