[project]
name = "rapport-agent"
version = "0.1.0"
description = "Rapport chat assistant (Strands on Amazon Bedrock AgentCore Runtime)"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.23.1",
    "boto3>=1.43.103",
    "certifi>=2026.7.22",
    "nh3>=0.3.7",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-ulid>=4.0.1",
    "strands-agents>=1.57.1",
    "typesafe-sdk>=0.7.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "rapport_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The agent reuses the API's services (api/app), packaged alongside it.
pythonpath = [".", "../api"]

[dependency-groups]
dev = [
    "moto[dynamodb,s3]>=5.2.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
